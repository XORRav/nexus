# ============================================================
# Nexus — tmux config
# Install: cp to ~/.tmux.conf
# ============================================================

# ---- Mouse support (click panes, scroll, resize) ----
set -g mouse on

# ---- Copy mode with vi keys ----
setw -g mode-keys vi

# Enter copy mode: Ctrl+b [
# Navigate: hjkl or arrow keys
# Start selection: v
# Copy selection: y
# Paste: Ctrl+b ]

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel

# ---- Copy to system clipboard (xclip) ----
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"

# ---- Better split keys ----
# Ctrl+b | for vertical split (instead of %)
# Ctrl+b - for horizontal split (instead of ")
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# ---- New windows/panes open in current directory ----
bind c new-window -c "#{pane_current_path}"

# ---- Start window/pane numbering at 1 ----
set -g base-index 1
setw -g pane-base-index 1

# ---- Don't rename windows automatically ----
set -g allow-rename off

# ---- Increase scrollback buffer ----
set -g history-limit 50000

# ---- Reduce escape delay (faster vim response) ----
set -sg escape-time 10

# ---- Status bar: use tmux defaults (green bar) ----
# No custom status-style, status-left, or status-right
# tmux default: green bar, [session] windows on left, hostname + time on right
