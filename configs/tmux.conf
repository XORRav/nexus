# ============================================================
# Nexus — tmux config
# Install: cp to ~/.tmux.conf
# ============================================================

# ---- Mouse support ----
set -g mouse on

# ---- Clipboard integration ----
set -g set-clipboard on
set -g allow-passthrough on

# ---- Vi copy mode ----
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xsel --clipboard --input"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xsel --clipboard --input"

# ---- Better split keys ----
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# ---- New windows in current dir ----
bind c new-window -c "#{pane_current_path}"

# ---- Start numbering at 1 ----
set -g base-index 1
setw -g pane-base-index 1

# ---- Don't rename windows automatically ----
set -g allow-rename off

# ---- Increase scrollback buffer ----
set -g history-limit 50000

# ---- Reduce escape delay (faster vim response) ----
set -sg escape-time 10
